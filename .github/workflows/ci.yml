# CI for websrt-gateway-cpp. Real file, not a symlink: GitHub Actions
# does not follow symlinks under .github/workflows (a symlinked workflow
# yields a 0-job failed run).
#
# clang-tidy job deliberately omitted: reliable tidy needs
# compile_commands.json for our targets, which requires the full
# configure (submodules + BoringSSL fetch + build) - not cheap, and
# header resolution without it is false-positive-prone - not reliable.

name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (same as WebSRT's build.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install prerequisites
        # Derived from build.sh + CMakePresets.json: ninja (preset
        # generator), go + nasm (BoringSSL fetch/build), zlib1g-dev
        # (libwebsrt's find_package(ZLIB)). gcc 13 and cmake >= 3.24
        # ship with ubuntu-24.04.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build golang-go nasm zlib1g-dev
      - name: Setup (submodules, BoringSSL, CMake configure)
        run: ./build.sh setup
      - name: Build
        run: |
          ./build.sh lib
          ./build.sh gateway
      - name: Test
        # Live-oracle tests (wt_echo, subscriber_test, publisher_test,
        # c_api_test from deps/libwebsrt) self-skip via SKIP_RETURN_CODE
        # 77 on runners without the Rust gateway. The tail lands in the
        # step summary (publicly viewable) because raw logs need auth.
        run: |
          set +e
          ./build.sh test 2>&1 | tee /tmp/ctest.log
          rc=${PIPESTATUS[0]}
          { echo "## ctest (exit $rc)"; echo '```'; tail -150 /tmp/ctest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are the one channel readable without login:
          # one ::error per failed test, carrying its output excerpt.
          python3 - <<'PY' || true
          import re
          log = open('/tmp/ctest.log', errors='replace').read()
          pat = re.compile(r'\s*\d+/\d+\s+Test\s+#\d+: (\S+)[ .]*\*\*\*(Failed|Timeout|Not Run)')
          blocks = re.split(r'(?m)(?=^\s*\d+/\d+\s+Test\s+#\d+:)', log)
          hits = [b for b in blocks if pat.match(b)]
          nl = chr(10)
          for b in hits:
              m = pat.match(b)
              excerpt = b.strip().replace(chr(13), '').replace(nl, ' | ')[-250:]
              print(f'::error::ctest {m.group(2).upper()}: {m.group(1)} -- {excerpt}')
          fails = [ln.strip() for ln in log.split(nl) if 'FAIL:' in ln][:8]
          for ln in fails:
              print('::error::' + ln[:250])
          PY
          exit $rc
      - name: Strip binary
        run: strip build/release/websrt-gateway
      - name: Upload gateway binary
        # The binary is self-contained: BoringSSL, lsquic and the srt
        # fork are linked statically - only system libs remain (ldd).
        uses: actions/upload-artifact@v7
        with:
          name: websrt-gateway-cpp-linux-x64
          path: build/release/websrt-gateway
          if-no-files-found: error

  # TSan coverage of the gateway's concurrency surfaces, same approach as
  # libwebsrt's ci (it builds the identical dependency tree). Scope, set
  # via the tsan preset in CMakePresets.json: everything compiled from
  # source is instrumented (-fsanitize=thread on both C and CXX flags) -
  # first-party gateway + tests, libwebsrt, the srt fork and lsquic;
  # BoringSSL stays uninstrumented (fetched + prebuilt Release by
  # ./build.sh setup, consumed unmodified). halt_on_error=1 makes any
  # race fail the job; cmake/tsan.supp carries the two known
  # dep-internal ones: the srt fork's CUDT::startup registered-flag guard
  # (same entry and reasoning as libwebsrt's tsan.supp) and
  # lsquic_global_init - lsquic globals are init-once with no internal
  # guard, and the in-process server+client tests can init while the
  # engine runs (never triggered by libwebsrt's own suite; production
  # has one engine per process).
  #
  # Test scope: the always-run set MINUS seven tests, via the tsan test
  # preset's exclusion filter (delete the filter entries to re-include):
  #   - concurrency_test, gateway_e2e_test, srt_ingest_test,
  #     web_server_test, reload_test, webhook_test all run
  #     Gateway::Start, which has a GENUINE first-party race: it calls
  #     loop_.SetTimer() from the caller thread after the loop thread is
  #     live (EventLoop's contract is loop-thread-only; see the note in
  #     cmake/tsan.supp). Under TSan timing the race does not just get
  #     flagged, it manifests - torn TimerEntry reads (use-after-free of
  #     the old timers_ buffer) and empty-callback bad_function_call
  #     aborts - so these tests are flaky-to-crashing and excluded until
  #     the gateway fix lands. (concurrency_test itself measured CI-sane
  #     under TSan - 48 s local, budgets held - the race, not runtime,
  #     keeps it out.)
  #   - srt_initiator_test: no race involved; its 10 s internal read
  #     deadline is blown by TSan's slowdown alone (16.7 s pass vs
  #     36.5 s fail-of-timeout locally, 2 fails in 3 runs).
  # The remaining 19 tests + the 4 live-oracle self-skips run green and
  # stable (~22 s locally, facade_race_test dominating).
  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build golang-go nasm zlib1g-dev
      - name: Setup (submodules, BoringSSL)
        run: ./build.sh setup
      - name: Build (TSan)
        run: |
          cmake --preset tsan -DWEBSRT_ENABLE_WT=ON
          cmake --build --preset tsan -j "$(nproc)"
      - name: Test (TSan)
        run: ctest --preset tsan

  # Publish a GitHub Release for every successful master build, like
  # WebSRT's build.yml: master push -> dev-<short_sha> marked latest
  # (must NOT be a prerelease - GitHub ignores make_latest on
  # pre-releases, losing the Latest badge and /releases/latest);
  # v* tag push -> stable release tagged <version>.
  release:
    needs: build-test
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: websrt-gateway-cpp-linux-x64
          path: artifacts/websrt-gateway-cpp-linux-x64
      - name: Stage release assets
        run: |
          mkdir -p release
          cp artifacts/websrt-gateway-cpp-linux-x64/websrt-gateway release/websrt-gateway-cpp-linux
          chmod +x release/websrt-gateway-cpp-linux
      - name: Set release metadata
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          short="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}"    >> "$GITHUB_OUTPUT"
            echo "name=${REF#refs/tags/}"   >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${short}"         >> "$GITHUB_OUTPUT"
            echo "name=Dev ${short}"        >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: false
          make_latest: true
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        # Pin to the version the tree is formatted with. ubuntu-24.04's
        # apt clang-format is 18, which formats `struct stat st{};`
        # differently from 19.
        run: pip install clang-format==19.1.7
      - name: clang-format check
        # Our sources only - never deps/ (.clang-format at repo root).
        run: find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
