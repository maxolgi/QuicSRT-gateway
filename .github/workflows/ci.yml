# CI for websrt-gateway-cpp. Real file, not a symlink: GitHub Actions
# does not follow symlinks under .github/workflows (a symlinked workflow
# yields a 0-job failed run).
#
# clang-tidy job deliberately omitted: reliable tidy needs
# compile_commands.json for our targets, which requires the full
# configure (submodules + BoringSSL fetch + build) - not cheap, and
# header resolution without it is false-positive-prone - not reliable.

name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (same as WebSRT's build.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install prerequisites
        # Derived from build.sh + CMakePresets.json: ninja (preset
        # generator), go + nasm (BoringSSL fetch/build), zlib1g-dev
        # (libwebsrt's find_package(ZLIB)). gcc 13 and cmake >= 3.24
        # ship with ubuntu-24.04.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build golang-go nasm zlib1g-dev
      - name: Setup (submodules, BoringSSL, CMake configure)
        run: ./build.sh setup
      - name: Build
        run: |
          ./build.sh lib
          ./build.sh gateway
      - name: Test
        # Live-oracle tests (wt_echo, subscriber_test, publisher_test,
        # c_api_test from deps/libwebsrt) self-skip via SKIP_RETURN_CODE
        # 77 on runners without the Rust gateway. The tail lands in the
        # step summary (publicly viewable) because raw logs need auth.
        run: |
          set +e
          ./build.sh test 2>&1 | tee /tmp/ctest.log
          rc=${PIPESTATUS[0]}
          { echo "## ctest (exit $rc)"; echo '```'; tail -150 /tmp/ctest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are the one channel readable without login:
          # one ::error per failed test, carrying its output excerpt.
          python3 - <<'PY' || true
          import re
          log = open('/tmp/ctest.log', errors='replace').read()
          pat = re.compile(r'\s*\d+/\d+\s+Test\s+#\d+: (\S+)[ .]*\*\*\*(Failed|Timeout|Not Run)')
          blocks = re.split(r'(?m)(?=^\s*\d+/\d+\s+Test\s+#\d+:)', log)
          hits = [b for b in blocks if pat.match(b)]
          nl = chr(10)
          for b in hits:
              m = pat.match(b)
              excerpt = b.strip().replace(chr(13), '').replace(nl, ' | ')[-250:]
              print(f'::error::ctest {m.group(2).upper()}: {m.group(1)} -- {excerpt}')
          fails = [ln.strip() for ln in log.split(nl) if 'FAIL:' in ln][:8]
          for ln in fails:
              print('::error::' + ln[:250])
          PY
          exit $rc
      - name: Strip binary
        run: strip build/release/websrt-gateway
      - name: Upload gateway binary
        # The binary is self-contained: BoringSSL, lsquic and the srt
        # fork are linked statically - only system libs remain (ldd).
        uses: actions/upload-artifact@v7
        with:
          name: websrt-gateway-cpp-linux-x64
          path: build/release/websrt-gateway
          if-no-files-found: error

  # Publish a GitHub Release for every successful master build, like
  # WebSRT's build.yml: master push -> dev-<short_sha> marked latest
  # (must NOT be a prerelease - GitHub ignores make_latest on
  # pre-releases, losing the Latest badge and /releases/latest);
  # v* tag push -> stable release tagged <version>.
  release:
    needs: build-test
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: websrt-gateway-cpp-linux-x64
          path: artifacts/websrt-gateway-cpp-linux-x64
      - name: Stage release assets
        run: |
          mkdir -p release
          cp artifacts/websrt-gateway-cpp-linux-x64/websrt-gateway release/websrt-gateway-cpp-linux
          chmod +x release/websrt-gateway-cpp-linux
      - name: Set release metadata
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          short="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}"    >> "$GITHUB_OUTPUT"
            echo "name=${REF#refs/tags/}"   >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${short}"         >> "$GITHUB_OUTPUT"
            echo "name=Dev ${short}"        >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: false
          make_latest: true
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        # Pin to the version the tree is formatted with. ubuntu-24.04's
        # apt clang-format is 18, which formats `struct stat st{};`
        # differently from 19.
        run: pip install clang-format==19.1.7
      - name: clang-format check
        # Our sources only - never deps/ (.clang-format at repo root).
        run: find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
