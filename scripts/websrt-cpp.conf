; Production supervisord config for the C++ WebSRT gateway.
; Repo artifact: copy to /etc/supervisor/conf.d/websrt-cpp.conf on the host,
; then   supervisorctl reread && supervisorctl update && supervisorctl restart websrt-cpp
; Mirrors WebSRT/websrt.conf (the Rust gateway) - same layout, same log
; directory convention, same LE key-permission requirement - with the C++
; binary's --config file instead of the Rust CLI's flag soup.
;
; The gateway needs two things the supervisor does not manage:
;
;   1. /etc/websrt-cpp/gateway.conf - the [server] scalars and the
;      [[stream]] allowlist. It must point web_root at a BUILT web/dist
;      (the C++ gateway never builds the player: copy or symlink
;      /home/flibb/maxolgi/WebSRT/web/dist, or wherever the checkout
;      lives on the host). Without web_root the web server refuses to
;      start, loudly.
;   2. In mkcert mode, the key file must be readable by www-data:
;      0640 root:ssl-cert on the privkey, as for the Rust gateway. The
;      certbot deploy hook that re-fixes the permissions on renewal must
;      also restart websrt-cpp.
;
; Without --config the gateway runs in open mode (any stream name
; accepted) and says so in a loud warning - do NOT deploy it that way.
;
; Bind notes: web_bind/web_port are the player over HTTPS (browsers need a
; secure context for WebTransport, so plain HTTP will not do); the
; health endpoint is plain HTTP on its own port and belongs on loopback
; unless you have a reason to expose the session/streams view.
;
; Logging: /var/log/websrt-cpp/ (create it; supervisord will not).
[program:websrt-cpp]
command=/usr/local/bin/websrt-gateway --config /etc/websrt-cpp/gateway.conf
directory=/var/www/websrt
user=www-data
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/websrt-cpp/gateway.out.log
stderr_logfile=/var/log/websrt-cpp/gateway.err.log