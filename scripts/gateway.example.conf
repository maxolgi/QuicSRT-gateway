# websrt-gateway example configuration (TOML).
# Copy, edit, run: websrt-gateway --config gateway.example.conf
#
# Every [server] key is optional (defaults shown); unknown keys are errors.
# With a config present the gateway denies by default everything the
# [[stream]] allowlist governs. Without --config it runs in open mode with
# a loud startup warning (dev/tests only).

[server]
wt_port = 4433                # WebTransport listen port
wt_bind = "127.0.0.1"         # WebTransport bind address
srt_ingest_port = 9000        # SRT/UDP ingest listen port (OBS/ffmpeg). With a
                               # config file present the ingest always runs;
                               # run without --config for a gateway with no
                               # ingest at all
srt_ingest_bind = "127.0.0.1" # ingest bind address (keep loopback unless the
                               # allowlist below is meaningful)
latency_ms = 120              # SRT TSBPD latency (floor 10); also scales the
                               # ingest receive buffer (8192..320000 packets)
max_bandwidth_kbps = 0        # 0 = unlimited
health_port = 0               # HTTP health/metrics (0 = disabled). Plain
                               # HTTP on its own port, like the Rust
                               # gateway: /health and /stats
health_bind = "127.0.0.1"     # keep it on loopback unless you want the
                               # stream/session view exposed (the gateway
                               # warns when it is not)
# web_port = 5173             # static web server over HTTPS (0 disables).
# web_bind = "0.0.0.0"
# web_root = "/opt/WebSRT/web/dist"
# web_tls = true
                                # web_root: the BUILT player. The C++ gateway
                                # never builds it (Rust WASM + TS are owned by
                                # the WebSRT repo), so it must point at a built
                                # web/dist - and web_port without web_root is a
                                # startup error rather than a silent 404 page.
                                # At boot the gateway writes
                                # <web_root>/cert-hash.js (the pinned cert hash
                                # + WT_PORT the player reads) and serves the
                                # tree over HTTPS, because browsers need a
                                # secure context for WebTransport. Both are off
                                # here so this file runs as-is; see the
                                # production block at the end.
                                # web_tls: false serves that same page over
                                # plain HTTP instead - the closed-network mode,
                                # where a browser already treats http://127.0.0.1
                                # and LAN pages as secure contexts. Only the page
                                # port changes: WebTransport stays TLS and the
                                # hash keeps being pinned via cert-hash.js.
max_viewers = 16              # per-stream concurrent viewer cap; further
                               # subscribers get HTTP 429 at admission
broadcast_capacity = 32768    # per-stream broadcaster ring depth, in SRT
                               # messages (6x188 B each: the default buffers
                               # ~37 MiB per live stream). When the ring is
                               # full the OLDEST message is dropped and a
                               # slow viewer counts the gap as lagged
                               # messages - a viewer never blocks a publisher.
cert_mode = "self"            # "self": fresh ECDSA cert every boot, hash pinned by
                               # browsers (cert-hash.js); "mkcert": PKI validation
# cert_pem = "cert.pem"       # required with cert_mode = "mkcert" (both files)
# key_pem = "key.pem"
# srt_passphrase = "0123456789"  # optional SRT PBKEY passphrase (10-79 chars).
#                                # NOT USABLE in this build: libwebsrt compiles
#                                # its srt fork with ENABLE_ENCRYPTION=OFF ("no
#                                # built-in crypto: WebTransport's TLS provides
#                                # it"), where a non-empty SRTO_PASSPHRASE is
#                                # rejected by the library. Setting it makes the
#                                # gateway exit at startup with that reason
#                                # rather than listen unencrypted.

# Stream allowlist. `name` is exact or a glob: '*' any chars, '?' one char.
# publish/subscribe default to true; token is optional (constant-time check).
# First matching entry wins.
#
# A viewer may attach BEFORE any publisher exists: the stream is created as
# an idle waiting stream and its subscribers start receiving as soon as a
# publisher appears. When that publisher ends, its viewers get a clean EOF
# (they may reconnect and wait again).
#
# Publishers - both WebTransport (`?publish=NAME`) and SRT/UDP ingest
# (OBS's `streamid`) - must match an entry with publish = true, and only one
# publisher holds a name at a time (first wins; the loser is refused).
#
# A per-stream `token` cannot be presented by an SRT publisher (its
# streamid carries no token), so a token-protected entry refuses ingest
# publishers: use a token only on browser-publish/subscribe streams.
#
# OBS / ffmpeg publishing to the ingest listener above, publishing under the
# name "test" (which is what viewers then pass as ?stream=test):
#
#   ffmpeg -re -f lavfi -i testsrc2=size=1280x720:rate=30 \
#          -c:v libx264 -preset veryfast -f mpegts \
#          "srt://127.0.0.1:9000?streamid=test&mode=caller&latency=120"
#
# then, from a browser on the same gateway:
#   https://<gw>:4433/?stream=test

[[stream]]
name = "test"

[[stream]]
name = "stage"
token = "letmein"

[[stream]]
name = "monitor-*"
publish = false               # viewers only on these

[[stream]]
name = "cam?"
subscribe = false             # publish-only (e.g. restricted feed)

# ---------------------------------------------------------------------------
# Production-style config (the shape scripts/websrt-cpp.conf deploys):
# every listener off loopback, the built player served over HTTPS, metrics
# on 9091 (loopback only - nginx/probes reach it over the local network),
# and a Let's Encrypt identity so browsers validate normally
# (cert-hash.js then advertises CERT_HASH = null). In self mode the cert is
# regenerated on every boot, the hash changes, and viewers must reload.
#
#   [server]
#   wt_port = 4433
#   wt_bind = "0.0.0.0"
#   srt_ingest_port = 9000
#   srt_ingest_bind = "0.0.0.0"
#   latency_ms = 120
#   health_port = 9091
#   health_bind = "127.0.0.1"
#   web_port = 8443
#   web_bind = "0.0.0.0"
#   web_root = "/opt/WebSRT/web/dist"
#   max_viewers = 16
#   cert_mode = "mkcert"
#   cert_pem = "/etc/letsencrypt/live/websrt.vyidd.com/fullchain.pem"
#   key_pem = "/etc/letsencrypt/live/websrt.vyidd.com/privkey.pem"
#
#   [[stream]]
#   name = "test"
#
# The viewer's URL is the WEB port, not the WebTransport port:
#   https://websrt.vyidd.com:8443/?stream=test
# (or https://.../?stream=test behind a reverse proxy that terminates 443;
# the page reads WT_PORT from cert-hash.js, so it always dials the gateway's
# WebTransport port, which stays 4433).
# ---------------------------------------------------------------------------
