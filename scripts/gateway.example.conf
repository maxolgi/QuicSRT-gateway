# websrt-gateway example configuration (TOML).
# Copy, edit, run: websrt-gateway --config gateway.example.conf
#
# Every [server] key is optional (defaults shown); unknown keys are errors.
# With a config present the gateway denies by default everything the
# [[stream]] allowlist governs. Without --config it runs in open mode with
# a loud startup warning (dev/tests only).

[server]
wt_port = 4433                # WebTransport listen port
wt_bind = "127.0.0.1"         # WebTransport bind address
srt_ingest_port = 9000        # SRT/UDP ingest listen port (OBS etc.)
srt_ingest_bind = "127.0.0.1"
latency_ms = 120              # SRT TSBPD latency (floor 10)
max_bandwidth_kbps = 0        # 0 = unlimited
health_port = 0               # HTTP health/metrics (0 = disabled)
health_bind = "127.0.0.1"
web_port = 5173               # static web server (serves web/dist; 0 disables)
web_bind = "127.0.0.1"
max_viewers = 16              # per-stream concurrent viewer cap
cert_mode = "self"            # "self": fresh ECDSA cert every boot, hash pinned by
                               # browsers (cert-hash.js); "mkcert": PKI validation
# cert_pem = "cert.pem"       # required with cert_mode = "mkcert" (both files)
# key_pem = "key.pem"
# srt_passphrase = "0123456789"  # optional SRT PBKEY passphrase (10-79 chars)

# Stream allowlist. `name` is exact or a glob: '*' any chars, '?' one char.
# publish/subscribe default to true; token is optional (constant-time check).
# First matching entry wins.

[[stream]]
name = "test"

[[stream]]
name = "stage"
token = "letmein"

[[stream]]
name = "monitor-*"
publish = false               # viewers only on these

[[stream]]
name = "cam?"
subscribe = false             # publish-only (e.g. restricted feed)
