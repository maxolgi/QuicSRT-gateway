# QuicSRT-gateway example configuration (TOML).
# A bare first run (no --config) writes this file to ./gateway.conf
# automatically; copy, edit, run: QuicSRT-gateway --config gateway.conf
#
# Every [server] key is optional (defaults shown); unknown keys are errors.
# With a config present the gateway denies by default everything the
# [[stream]] allowlist governs. Without --config it runs in open mode with
# a loud startup warning (dev/tests only).

[server]
wt_port = 4433                # WebTransport listen port
wt_bind = "127.0.0.1"         # WebTransport bind address
srt_ingest_port = 9000        # SRT/UDP ingest listen port (OBS/ffmpeg). With a
                               # config file present the ingest always runs;
                               # run without --config for a gateway with no
                               # ingest at all
srt_ingest_bind = "127.0.0.1" # ingest bind address (keep loopback unless the
                               # allowlist below is meaningful)
latency_ms = 120              # SRT TSBPD latency (floor 10); also scales the
                               # ingest receive buffer (8192..320000 packets)
max_bandwidth_kbps = 0        # accepted but NOT wired into any runtime path in
                               # this build - boot and SIGHUP reload alike
                               # ignore it (0 = unlimited is the intended
                               # meaning once it is wired)
health_port = 0               # HTTP health/metrics (0 = disabled). Plain
                               # HTTP on its own port: /health and /stats
health_bind = "127.0.0.1"     # keep it on loopback unless you want the
                               # stream/session view exposed (the gateway
                               # warns when it is not)
# web_port = 5173             # static web server (0 disables). Serves the
#                              # player EMBEDDED in the binary (web/dist,
#                              # fetched from the websrt-wasm-cpp release
#                              # by ./build.sh setup).
# # web_bind = "0.0.0.0"
# # web_root = "/opt/player/dist"
#                              # web_root: optional disk OVERRIDE of the
#                              # embedded player (dev/ops escape hatch); unset
#                              # serves the embed. Browsers need a secure
#                              # context for WebTransport, hence HTTPS by
#                              # default. cert-hash.js (the pinned cert hash +
#                              # WT_PORT the player reads) is served
#                              # dynamically at /cert-hash.js - never written
#                              # to disk, regenerated every boot, so self-mode
#                              # viewers must reload after a restart.
# # web_tls = true
#                              # web_tls: false serves the same page over
#                              # plain HTTP instead - the closed-network mode,
#                              # where a browser already treats http://127.0.0.1
#                              # and LAN pages as secure contexts. Only the
#                              # page port changes: WebTransport stays TLS and
#                              # the hash keeps being pinned via cert-hash.js.
max_viewers = 16              # per-stream concurrent viewer cap; further
                               # subscribers get HTTP 429 at admission
broadcast_capacity = 32768    # per-stream broadcaster ring depth, in SRT
                               # messages (6x188 B each: the default buffers
                               # ~37 MiB per live stream). When the ring is
                               # full the OLDEST message is dropped and a
                               # slow viewer counts the gap as lagged
                               # messages - a viewer never blocks a publisher.
broadcast_byte_budget = 67108864
                               # per-stream ring RETAINED-BYTES budget: with
                               # large SRT messages (whole ~0.3 MB GOP frames)
                               # the count cap above bounds no byte volume, so
                               # past this many retained bytes the OLDEST
                               # messages drop instead (counted in ring_drops
                               # in /stats, like count-cap drops). Range
                               # 4194304..1099511627776 (4 MiB..1 TiB); the
                               # floor is the largest message the gateway
                               # reassembles, so even at the minimum one
                               # whole message stays buffered.
max_sessions_per_ip = 10      # concurrent WT sessions one peer IP may hold;
                               # over the cap the CONNECT is answered 429.
                               # 0 = unlimited
max_sessions = 1000           # total concurrent WT sessions (0 = unlimited)
max_ingest_sessions = 100     # concurrent SRT ingest publisher connections (0 =
                               # unlimited). Every accepted publisher holds a
                               # ~1 MiB receive buffer plus latency-scaled srt
                               # buffers and its accept does synchronous
                               # round-trips onto the gateway loop, so past the
                               # cap the new connection is refused right at
                               # accept - the ingest analogue of max_sessions
                               # above (range 0..1000000).
wt_idle_timeout_s = 10        # close a WT connection after this many silent
                               # seconds (1..600; media and ACKs reset it)
wt_handshake_timeout_s = 10   # QUIC/WT handshake budget in seconds (1..60)
request_header_timeout_s = 30 # TOTAL budget for receiving ONE request's
                               # headers on the web and health servers, in
                               # seconds (1..600). The per-read 10 s idle
                               # cutoff never fires for a client trickling
                               # a byte every few seconds; past this budget
                               # such a connection is answered 408 and
                               # closed, so slow senders cannot hold the
                               # bounded worker pool - and with it /health
                               # and the player - hostage.
cert_mode = "self"            # "self": fresh ECDSA cert every boot, hash pinned by
                               # browsers (cert-hash.js); "mkcert": PKI validation
# cert_pem = "cert.pem"       # required with cert_mode = "mkcert" (both files)
# key_pem = "key.pem"
# srt_passphrase = "0123456789"  # optional SRT PBKEY passphrase (10-79 chars).
#                                # NOT USABLE in this build: libquicsrt compiles
#                                # its srt fork with ENABLE_ENCRYPTION=OFF ("no
#                                # built-in crypto: WebTransport's TLS provides
#                                # it"), where a non-empty SRTO_PASSPHRASE is
#                                # rejected by the library. Setting it makes the
#                                # gateway exit at startup with that reason
#                                # rather than listen unencrypted.
# log_level = "info"          # lsquic diagnostic logging on stderr (emerg,
                               # alert, crit, error, warn, notice, info,
                               # debug). Absent leaves the process default;
                               # the --log-level CLI flag wins at boot; a
                               # SIGHUP reload swaps it at runtime.

# Stream allowlist. `name` is exact or a glob: '*' any chars, '?' one char.
# publish/subscribe default to true; token is optional (constant-time check).
# First matching entry wins. An EMPTY allowlist (no [[stream]] sections at
# all) allows every stream name - open mode with this file's [server]
# settings; a 'name = "*"' entry does the same alongside other entries.
#
# A viewer may attach BEFORE any publisher exists: the stream is created as
# an idle waiting stream and its subscribers start receiving as soon as a
# publisher appears. When that publisher ends, its viewers get a clean EOF
# (they may reconnect and wait again).
#
# Publishers - both WebTransport (`?publish=NAME`) and SRT/UDP ingest
# (OBS's `streamid`) - must match an entry with publish = true, and only one
# publisher holds a name at a time (first wins; the loser is refused).
#
# A per-stream `token` cannot be presented by an SRT publisher (its
# streamid carries no token), so a token-protected entry refuses ingest
# publishers: use a token only on browser-publish/subscribe streams.
#
# OBS / ffmpeg publishing to the ingest listener above, publishing under the
# name "test" (which is what viewers then pass as ?stream=test):
#
#   ffmpeg -re -f lavfi -i testsrc2=size=1280x720:rate=30 \
#          -c:v libx264 -preset veryfast -f mpegts \
#          "srt://127.0.0.1:9000?streamid=test&mode=caller&latency=120"
#
# then, from a browser on the same gateway:
#   https://<gw>:4433/?stream=test

[[stream]]
name = "test"

[[stream]]
name = "stage"
token = "letmein"

[[stream]]
name = "monitor-*"
publish = false               # viewers only on these

[[stream]]
name = "cam?"
subscribe = false             # publish-only (e.g. restricted feed)

# Session-lifecycle webhooks (P4 step 3). Absent table = feature off.
# A small JSON body is POSTed (fire-and-forget, one dedicated worker
# thread, bounded queue with drop counting surfaced in /stats, one retry
# on failure) on: viewer_connect, viewer_disconnect, publisher_connect,
# publisher_disconnect, publisher_end (stream end) - for WebTransport
# sessions AND SRT ingest publishers. Plain http:// only (SLS-style
# receivers are local); URL/timeout swap on SIGHUP reload.
#
#   [webhooks]
#   on_event_url = "http://127.0.0.1:9090/hook"
#   timeout_ms = 2000          # per POST attempt, 1..60000

# ---------------------------------------------------------------------------
# Production-style config (the shape scripts/QuicSRT-gateway.conf deploys):
# every listener off loopback, the EMBEDDED player served over HTTPS,
# metrics on 9091 (loopback only - probes reach it over the local
# network), and a Let's Encrypt identity so browsers validate normally
# (cert-hash.js then advertises CERT_HASH = null). In self mode the cert
# is regenerated on every boot, the hash changes, and viewers must
# reload.
#
#   [server]
#   wt_port = 4433
#   wt_bind = "0.0.0.0"
#   srt_ingest_port = 9000
#   srt_ingest_bind = "0.0.0.0"
#   latency_ms = 120
#   health_port = 9091
#   health_bind = "127.0.0.1"
#   web_port = 8443
#   web_bind = "0.0.0.0"
#   max_viewers = 16
#   cert_mode = "mkcert"
#   cert_pem = "/etc/letsencrypt/live/websrt.vyidd.com/fullchain.pem"
#   key_pem = "/etc/letsencrypt/live/websrt.vyidd.com/privkey.pem"
#
#   [[stream]]
#   name = "test"
#
# The viewer's URL is the WEB port, not the WebTransport port:
#   https://websrt.vyidd.com:8443/?stream=test
# (or https://.../?stream=test behind a reverse proxy that terminates 443;
# the page reads WT_PORT from cert-hash.js, so it always dials the gateway's
# WebTransport port, which stays 4433).
# ---------------------------------------------------------------------------
