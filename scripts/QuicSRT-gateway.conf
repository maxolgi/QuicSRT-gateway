; Production supervisord config for the QuicSRT gateway.
; Repo artifact: copy to /etc/supervisor/conf.d/QuicSRT-gateway.conf on the host,
; then   supervisorctl reread && supervisorctl update && supervisorctl restart QuicSRT-gateway
; Standard supervisord layout and log-directory convention, with the C++
; binary's --config file instead of CLI flags.
;
; The gateway needs two things the supervisor does not manage:
;
;   1. /etc/QuicSRT-gateway/gateway.conf - the [server] scalars and the
;      [[stream]] allowlist. Start from the installed example
;      (cmake --install puts gateway.example.conf under <prefix>/etc/
;      QuicSRT-gateway/; copy it to /etc/QuicSRT-gateway/gateway.conf and edit).
;      The player is EMBEDDED in the binary (web/dist fetched from the
;      websrt-wasm-cpp release at build time by ./build.sh setup):
;      web_port alone turns the web server on, no web_root and
;      no player directory to deploy. An optional [server].web_root
;      still overrides the embed with a disk directory when needed.
;   2. In mkcert mode, the key file must be readable by www-data:
;      0640 root:ssl-cert on the privkey. The
;      certbot deploy hook that re-fixes the permissions on renewal must
;      also restart QuicSRT-gateway.
;
; Without --config the gateway runs in open mode (any stream name
; accepted) and says so in a loud warning - do NOT deploy it that way.
;
; Bind notes: web_bind/web_port are the player over HTTPS (browsers need a
; secure context for WebTransport, so plain HTTP will not do); the
; health endpoint is plain HTTP on its own port and belongs on loopback
; unless you have a reason to expose the session/streams view.
;
; Logging: /var/log/QuicSRT-gateway/ (create it; supervisord will not).
[program:QuicSRT-gateway]
command=/usr/local/bin/QuicSRT-gateway --config /etc/QuicSRT-gateway/gateway.conf
directory=/var/www/websrt
user=www-data
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/QuicSRT-gateway/gateway.out.log
stderr_logfile=/var/log/QuicSRT-gateway/gateway.err.log