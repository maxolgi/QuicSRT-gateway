; Supervisord config for the quicsrt:// ABR-ladder transcoder
; (scripts/QuicSRT-gateway-transcode.sh - see its header for the flag
; rationale and the verified PTS/keyframe-alignment properties).
;
; Repo artifact, run from the checkout like QuicSRT-gateway-testpub:
; adjust the command= path to this checkout, then
;   sudo cp this file /etc/supervisor/conf.d/QuicSRT-gateway-transcode.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Tune the ladder via environment= (name:WxH:bitrate:vbv-bufsize entries);
; renditions publish as ${STREAM}_<name>. Example for a 1280x720 source:
;   environment=STREAM="cam1",LADDER="540p:960x540:1200k:400k 360p:640x360:600k:200k"
;
; The input needs the libquicsrt-patched ffmpeg (workspace sibling at
; ../libquicsrt/deps/ffmpeg) - the script resolves it itself. Logging
; convention as the other QuicSRT-gateway programs (/var/log/QuicSRT-gateway/,
; which exists on this host).
[program:QuicSRT-gateway-transcode]
command=/home/flibb/maxolgi/QuicSRT-cpp/QuicSRT-gateway/scripts/QuicSRT-gateway-transcode.sh
user=flibb
environment=STREAM="browsertest"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/QuicSRT-gateway/transcode.out.log
stderr_logfile=/var/log/QuicSRT-gateway/transcode.err.log
